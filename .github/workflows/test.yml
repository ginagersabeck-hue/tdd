name: Unit and functional tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snakemake pandas pycodestyle pytest

      - name: Run unit tests
        run: python test/unit/test_fire_gdp.py

  run_functional_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snakemake pandas pycodestyle pytest

      - name: Run functional tests
        run: bash test/func/test_fire_gdp.sh
